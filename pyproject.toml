[project]
name = "qwenpaw-feishu-plus"
version = "1.2.3"
description = "对QwenPaw平台飞书频道的增强插件"
readme = "README.md"
authors = [
    { name = "boringcat", email = "boringcat@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# 自动发现 tests/ 目录下的所有测试
testpaths = ["tests"]
# marker 注册（随新模块增加时在此补充）
markers = [
    "asyncio: 异步测试",
]
# 显示中文 test ID（而非 \uxxxx 转义）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
# 异步测试默认模式
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "lark-oapi>=1.7.3",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.0",
    "qwenpaw>=2.0.0",
]
